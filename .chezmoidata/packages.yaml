    - duf
    - dust
    - emacs-wayland
    - eza
    - fd
    - firefox
    - fzf
    - ghostty
    - git-delta
    - graphviz
    - hyperfine
    - keychain
    - lazygit
    - lua-language-server
    - neovim
    - ollama-cuda
    - pinentry
    - pixi
    - ripgrep
    - sccache
    - shellcheck
    - starship
    - superfile
    - tailscale
    - uv
    - vim
    - visual-studio-code-bin
