# Packages that must remain installed on Omarchy hosts. The apply hook is
# additive: it restores missing entries but never removes unlisted packages.
omarchyPackages:
  pacman:
    - atuin
    - aws-cli-v2
    - bitwarden
    - bitwarden-cli
    - btop
    - chezmoi
    - cmake
    - dropbox
    - dropbox-cli
    - duf
    - dust
    - eza
    - firefox
    - fzf
    - ghostty
    - git-delta
    - graphviz
    - hyperfine
    - keychain
    - lazygit
    - lua-language-server
    - neovim
    - openai-codex-desktop
    - pinentry
    - protonmail-bridge
    - ripgrep
    - sccache
    - shellcheck
    - starship
    - tailscale
    - vim
    - visual-studio-code-bin
    - wl-clipboard
    - zed
    - zoxide
    - zsh
  aur:
    - proton-mail-bin
    - slack-desktop
