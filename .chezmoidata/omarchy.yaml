# Omarchy desktop selections, applied by the run_after_omarchy-*.sh
# scripts. Read only on Omarchy; .chezmoiignore keeps those scripts off every
# other OS.
#
# What belongs here: settings whose source of truth is ~/.local/state or a
# system database rather than a file under ~/.config, so they cannot be tracked
# as plain dotfiles. Anything that IS a plain file is tracked as one instead —
# the default agent, terminal and browser all are. See docs/omarchy.md.

omarchy:
  # Slug from `omarchy theme list`. Stock themes live in
  # /usr/share/omarchy/themes, user themes and overlays in
  # ~/.config/omarchy/themes.
  theme: gruvbox

  # Basename of an image in the theme's own backgrounds/ directory or in
  # ~/.config/omarchy/backgrounds/<theme>/. Leave empty to accept whatever
  # `omarchy theme set` cycles to, which is not stable across machines.
  background: 2-flower-basket.jpg

  # `omarchy font list`. fontconfig is the source of truth and the terminals
  # are sed-ed to match, which is why this is a command and not a tracked
  # fonts.conf. The font package must be installed — see packages.repo.
  font: JetBrainsMono Nerd Font

  # One of code|cursor|zed|sublime_text|helix|vim|emacs|nvim. Persisted to
  # ~/.local/state/omarchy/defaults/editor, hence not a tracked file.
  editor: nvim

  # Packages beyond Omarchy's own baseline
  # (/usr/share/omarchy/install/omarchy-*.packages), which every Omarchy
  # install already has. Deliberately only the chosen applications: the
  # hardware-driven half of this machine's package delta — intel-ucode,
  # lib32-vulkan-intel, ollama-cuda, supergfxctl, fprintd, libfprint,
  # efibootmgr, mkinitcpio, usbutils — belongs to this laptop, not to the
  # setup, and installing it elsewhere would be wrong.
  packages:
    # From the configured repositories, which on Omarchy includes the
    # `omarchy` repo and multilib (both are in its default pacman.conf).
    repo:
      - bitwarden
      - bitwarden-cli
      - dropbox
      - dropbox-cli
      # Plain Emacs, deliberately not the omarchy-emacs integration package.
      # That one's setup writes init.el, omarchy.el and themes/ into
      # ~/.config/emacs, which is where Doom's checkout goes (see
      # run_onchange_after_clone-doom-emacs.sh.tmpl). Its theme and whitespace
      # opinions also override doom-theme and ws-butler. docs/omarchy.md has
      # the full comparison.
      - emacs-wayland
      - gamescope
      - ghostty
      - nautilus-dropbox
      - openai-codex-desktop
      - signal-desktop
      - spotify
      - steam
      - tailscale
      - vim
      - voxtype-bin
    # Fonts, separated from the applications above only because they are a
    # category that grows on its own. They install by the same path: plain
    # repo packages. Not `omarchy install font`, which installs *and* switches
    # the active font — making a font available and choosing it are separate
    # decisions, and the choice is `omarchy.font` above.
    fonts:
      - ttf-cascadia-mono-nerd
      - ttf-firacode-nerd
    # AUR, built through yay. Slower and occasionally broken, so keep this
    # list as short as it can be.
    aur:
      - brave-origin-bin
      - slack-desktop

  # Editors installed with `omarchy install editor <key>` rather than a plain
  # package add, because each installer does post-install work that a bare
  # `pacman -S` skips: `omazed setup` wires Zed's theme to Omarchy's, and the
  # VSCode installer writes ~/.vscode/argv.json (so credentials go to
  # gnome-libsecret) and pins update.mode. Vim is not here — it is just a
  # package, so it lives in packages.repo above.
  #
  # The value is the package whose presence proves the editor is installed,
  # which is what keeps this from re-running on every apply. It is not always
  # the key: `omarchy install editor zed` installs zed *and* omazed.
  #
  # Emacs is deliberately absent — see the emacs-wayland note above.
  editors:
    vscode: visual-studio-code-bin
    zed: zed
