# Tool and runtime versions live under dot_config/mise/conf.d/. This file pins
# what chezmoi itself fetches.
doom:
  repo: https://github.com/doomemacs/core.git
  rev: 1404f1bac5a2ae8602b4d861f7805e194c05d28c

plugins:
  vim:
    gruvbox:
      url: https://github.com/morhetz/gruvbox/archive/697c00291db857ca0af00ec154e5bd514a79191f.tar.gz
      include:
        - "*/autoload/**"
        - "*/colors/**"
    nerdcommenter:
      url: https://github.com/preservim/nerdcommenter/archive/a462bbda1e26f44fb3d3eb9d9d1c6a07aa98e665.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/plugin/**"
    nerdtree:
      url: https://github.com/preservim/nerdtree/archive/690d061b591525890f1471c6675bcb5bdc8cdff9.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/lib"
        - "*/lib/**"
        - "*/lib/nerdtree/**"
        - "*/nerdtree_plugin/**"
        - "*/plugin/**"
        - "*/syntax/**"
    vim_fugitive:
      url: https://github.com/tpope/vim-fugitive/archive/3b753cf8c6a4dcde6edee8827d464ba9b8c4a6f0.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/ftdetect/**"
        - "*/ftplugin/**"
        - "*/plugin/**"
        - "*/syntax/**"
    vim_surround:
      url: https://github.com/tpope/vim-surround/archive/3d188ed2113431cf8dac77be61b842acb64433d9.tar.gz
      include:
        - "*/doc/**"
        - "*/plugin/**"
