# Tool and runtime versions are not here — they live in
# dot_config/mise/conf.d/. This file pins what chezmoi itself fetches.

# The one binary the standalone layer fetches for itself. Pinned like
# everything else here: an unprivileged box is exactly where you least want a
# silent version change, because you have no package manager to roll back with.
# Bump this and `chezmoi apply` re-fetches — the version is rendered into
# run_onchange_after_fetch-portable-tools.sh, so changing it changes the script.
standalone:
  mise:
    version: v2026.8.9
    repo: jdx/mise

doom:
  repo: https://github.com/doomemacs/doomemacs.git
  rev: ad55ed08df3a1d3398d136d07b60ba2ad00fb91b

plugins:
  vim:
    gruvbox:
      url: https://github.com/morhetz/gruvbox/archive/697c00291db857ca0af00ec154e5bd514a79191f.tar.gz
      include:
        - "*/autoload/**"
        - "*/colors/**"
    nerdcommenter:
      url: https://github.com/preservim/nerdcommenter/archive/a462bbda1e26f44fb3d3eb9d9d1c6a07aa98e665.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/plugin/**"
    nerdtree:
      url: https://github.com/preservim/nerdtree/archive/690d061b591525890f1471c6675bcb5bdc8cdff9.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/lib"
        - "*/lib/**"
        - "*/lib/nerdtree/**"
        - "*/nerdtree_plugin/**"
        - "*/plugin/**"
        - "*/syntax/**"
    vim_fugitive:
      url: https://github.com/tpope/vim-fugitive/archive/61b51c09b7c9ce04e821f6cf76ea4f6f903e3cf4.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/ftdetect/**"
        - "*/ftplugin/**"
        - "*/plugin/**"
        - "*/syntax/**"
    vim_surround:
      url: https://github.com/tpope/vim-surround/archive/3d188ed2113431cf8dac77be61b842acb64433d9.tar.gz
      include:
        - "*/doc/**"
        - "*/plugin/**"
