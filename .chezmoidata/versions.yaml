tools:
  darwin:
    arm64:
      keychain:
        type: file
        url: https://github.com/danielrobbins/keychain/releases/download/2.9.8/keychain
        sha256: f8b4e8a2a630907bb81737d455a2dec2cb8308e3210840665239ef9c49bbeadb

plugins:
  tmux:
    tpm:
      url: https://github.com/tmux-plugins/tpm/archive/99469c4a9b1ccf77fade25842dc7bafbc8ce9946.tar.gz
  vim:
    gruvbox:
      url: https://github.com/morhetz/gruvbox/archive/697c00291db857ca0af00ec154e5bd514a79191f.tar.gz
      include:
        - "*/autoload/**"
        - "*/colors/**"
    nerdcommenter:
      url: https://github.com/preservim/nerdcommenter/archive/a462bbda1e26f44fb3d3eb9d9d1c6a07aa98e665.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/plugin/**"
    nerdtree:
      url: https://github.com/preservim/nerdtree/archive/690d061b591525890f1471c6675bcb5bdc8cdff9.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/lib"
        - "*/lib/**"
        - "*/lib/nerdtree/**"
        - "*/nerdtree_plugin/**"
        - "*/plugin/**"
        - "*/syntax/**"
    vim_fugitive:
      url: https://github.com/tpope/vim-fugitive/archive/61b51c09b7c9ce04e821f6cf76ea4f6f903e3cf4.tar.gz
      include:
        - "*/autoload/**"
        - "*/doc/**"
        - "*/ftdetect/**"
        - "*/ftplugin/**"
        - "*/plugin/**"
        - "*/syntax/**"
    vim_surround:
      url: https://github.com/tpope/vim-surround/archive/3d188ed2113431cf8dac77be61b842acb64433d9.tar.gz
      include:
        - "*/doc/**"
        - "*/plugin/**"
