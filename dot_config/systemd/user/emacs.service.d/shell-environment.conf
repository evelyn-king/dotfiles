# systemd units skip shell startup, so the packaged emacs.service would start
# the daemon with the user manager's bare PATH: no mise shims, ~/.local/bin or
# extras.sh. Start it through ~/.profile to give it what `ssh host cmd` gets.
# `exec` keeps Emacs as the main process, which Type=notify requires. The
# profile can end on a false test, so its status must not gate the exec.
[Service]
ExecStart=
ExecStart=/bin/sh -c '. %h/.profile; exec emacs --fg-daemon'
