# Language runtimes and every global CLI tool.
#
# Versions are exact and move deliberately: `mise upgrade --bump` rewrites this
# file, so an upgrade arrives as one reviewable diff — the same contract
# nix/flake.lock has for the system closure. `mise.lock` pins the resolved
# artefacts alongside it.
#
# The division of labour: nix-darwin owns the system closure, mise owns
# everything above it. `bun` and `uv` deliberately stay in the flake — they are
# the backends mise shells out to for `npm:` and `pipx:` tools, so installing
# them through mise would be a needless ordering dependency.
#
# `mise activate zsh` runs in .zshrc, so these are interactive-shell tools.
# See docs/nix-darwin.md for the boundary and docs/shell-startup.md for the
# activation point.

[settings]
lockfile = true
# uv and bun are faster than pipx/npm and both come from the flake.
npm.package_manager = "bun"

[tools]

# --- runtimes ---------------------------------------------------------------
# Pinned to what the machine ran before mise took them over: node and go came
# from the flake, python from a hand-installed /usr/local/bin copy.
node = "24.19.0"
python = "3.13.7"
go = "1.26.5"

# --- python tooling ---------------------------------------------------------
"pipx:black" = "26.5.1"
"pipx:conda-lock" = "4.0.0"
"pipx:docling-slim" = "2.120.1"
"pipx:markdown-code-runner" = "2.7.0"
"pipx:mypy" = "2.1.0"
"pipx:poethepoet" = "0.48.0"
"pipx:ruff" = "0.15.15"
"pipx:tuitorial" = "0.16.0"
"pipx:unidep[all]" = "3.3.2"
# pre-commit-uv makes pre-commit build its hook environments with uv. It is an
# injected dependency rather than a tool, hence uvx_args rather than an entry.
"pipx:pre-commit" = { version = "4.6.0", uvx_args = "--with pre-commit-uv" }

# --- javascript tooling -----------------------------------------------------
"npm:@doist/todoist-cli" = "3.1.8"
"npm:@google/gemini-cli" = "0.55.1"
"npm:@googleworkspace/cli" = "0.22.5"
"npm:@just-every/code" = "0.6.172"
"npm:@openai/codex" = "0.147.0"
"npm:opencode-ai" = "1.18.18"
"npm:tree-sitter-cli" = "0.26.12"

# --- other ------------------------------------------------------------------
# nixpkgs' micromamba has no aarch64-darwin substitute and fails to build from
# source, so it used to be a hand-run `curl | tar`. mise fetches the same
# standalone binary from the upstream releases, pinned.
micromamba = "2.9.0-0"
