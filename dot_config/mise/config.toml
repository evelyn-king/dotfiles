# Language runtimes and every global CLI tool.
#
# Versions are exact and move deliberately: `mise upgrade --bump` rewrites this
# file, so an upgrade arrives as one reviewable diff rather than as silent
# drift between machines. `mise.lock` pins the resolved artefacts alongside it.
#
# This is the only thing the repo installs. Everything else — the system
# packages, the editors, the fonts, `bun` and `uv` themselves — is yours to put
# on the machine by whatever means that machine prefers: brew, apt, pacman, nix.
# Configs detect what they find at runtime rather than assuming a provider.
#
# `bun` and `uv` are deliberately absent below. mise shells out to them for its
# `npm:` and `pipx:` backends, so installing them through mise would be a
# needless ordering dependency; without them mise falls back to slower defaults
# rather than failing.
#
# `mise activate` runs in the interactive rc, so these are interactive-shell
# tools. See docs/shell-startup.md for the activation point.

[settings]
lockfile = true
# uv and bun are faster than pipx/npm and both come from the flake.
npm.package_manager = "bun"

[tools]

# --- runtimes ---------------------------------------------------------------
# Pinned to what the machine ran before mise took them over: node and go came
# from the flake, python from a hand-installed /usr/local/bin copy.
node = "24.19.0"
python = "3.13.7"
go = "1.26.5"

# --- python tooling ---------------------------------------------------------
"pipx:black" = "26.5.1"
"pipx:conda-lock" = "4.0.0"
"pipx:docling-slim" = "2.120.1"
"pipx:markdown-code-runner" = "2.7.0"
"pipx:mypy" = "2.1.0"
"pipx:poethepoet" = "0.48.0"
"pipx:ruff" = "0.15.15"
"pipx:tuitorial" = "0.16.0"
"pipx:unidep[all]" = "3.3.2"
# pre-commit-uv makes pre-commit build its hook environments with uv. It is an
# injected dependency rather than a tool, hence uvx_args rather than an entry.
"pipx:pre-commit" = { version = "4.6.0", uvx_args = "--with pre-commit-uv" }

# --- javascript tooling -----------------------------------------------------
"npm:@doist/todoist-cli" = "3.1.8"
"npm:@google/gemini-cli" = "0.55.1"
"npm:@googleworkspace/cli" = "0.22.5"
"npm:@just-every/code" = "0.6.172"
"npm:@openai/codex" = "0.147.0"
"npm:opencode-ai" = "1.18.18"
"npm:tree-sitter-cli" = "0.26.12"

# --- other ------------------------------------------------------------------
# mise fetches the upstream standalone binary, pinned, and resolves the right
# artefact per platform — which is the reason it lives here rather than being
# left to each machine's package manager.
micromamba = "2.9.0-0"
