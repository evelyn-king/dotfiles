# Language runtimes and every global CLI tool.
#
# This is a conf.d file rather than ~/.config/mise/config.toml itself. That
# keeps the declarative tool list separate from mise's generated global state.
# config.toml has higher precedence, so the migration script removes audited
# old versions and warns when it finds unrecognized content there.
#
# Update pinned versions in this file. Entries set to "latest" or a release
# channel such as "stable" intentionally float.
#
# Nix supplies uv and bun on macOS; Omarchy supplies them on Linux. mise uses
# those system tools as the fast installers for its npm and pipx backends.
#
# Interactive shells use `mise activate`; static shims cover remote SSH commands
# whose shell reads the managed environment.

[settings]
# Project configs can opt into lockfiles; global locks are refreshed explicitly.
lockfile = true
# uv and bun are faster than the pipx/npm defaults.
npm.package_manager = "bun"
# mise hides releases younger than a day, which is supply-chain protection
# worth keeping. The coding agents ship several times a day and are the reason
# they are pinned to "latest" at all, so waive the cooldown for those alone.
# This has to live in config rather than in `mup`'s environment: `mise lock`
# and `mise install` both consult it, and a waiver applied to only the first
# bumps the lockfile to a version the second (and `chezmoi apply`) refuses.
minimum_release_age_excludes = [
  "claude",
  "codex",
  "opencode",
  "pi",
  "npm:@google/gemini-cli",
  "npm:@just-every/code",
]

[tools]

# --- runtimes ---------------------------------------------------------------
node = "26.8.0"
python = "3.14.7"
go = "1.27.0"
rust = { version = "stable", profile = "default" }

# --- coding agents ----------------------------------------------------------
claude = "latest"
codex = "latest"
opencode = "latest"
pi = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@just-every/code" = "latest"

# --- python tooling ---------------------------------------------------------
"pipx:black" = "26.5.1"
"pipx:conda-lock" = "4.0.2"
"pipx:conda-package-handling" = "2.5.0"
"pipx:docling-slim" = "2.123.0"
"pipx:markdown-code-runner" = "2.7.0"
"pipx:mypy" = "2.3.1"
"pipx:poethepoet" = "0.48.0"
"pipx:ruff" = "0.16.4"
"pipx:tuitorial" = "0.16.0"
"pipx:unidep" = { version = "3.4.2", uvx_args = "--with unidep[all]" }
"pipx:pre-commit" = { version = "4.6.2", uvx_args = "--with pre-commit-uv" }

# --- javascript tooling -----------------------------------------------------
"npm:@doist/todoist-cli" = "4.0.0"
"npm:@googleworkspace/cli" = "0.22.5"
"npm:tree-sitter-cli" = "0.26.13"

# --- other ------------------------------------------------------------------
gh = "latest"
herdr = "0.8.2"
usage = "latest"
micromamba = "2.9.0-0"
