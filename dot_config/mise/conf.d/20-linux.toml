# Portable CLI tools whose distro packages are missing or too old.
#
# System packages are not declared here. Omarchy owns pacman and the AUR through
# its own install flow; docs/package-lists/omarchy-linux.md is the source of
# truth for those. mise owns only what it can install into $HOME.
#
# If a non-Omarchy Linux host ever joins, add a `[bootstrap.packages]` block
# here behind a distro branch. mise config files are Tera templates, so
# `exec(command="sh -c '. /etc/os-release; echo $ID'")` selects the manager
# without a second config file or a second lockfile.

min_version = "2026.7.13"

[settings]
lockfile_platforms = ["linux-x64"]

# The preferred vfox backend currently locks eza as the literal version
# "latest" and produces a dead vlatest URL. Aqua resolves an exact release and
# checksum instead.
[tool_alias]
eza = "aqua:eza-community/eza"

[tools]
ast-grep = "latest"
atuin = "latest"
bat = "latest"
btop = "latest"
bun = "latest"
chezmoi = "latest"
delta = "latest"
direnv = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gcloud = "latest"
graphviz = "latest"
hyperfine = "latest"
lazygit = "latest"
lua-language-server = "latest"
neovim = "latest"
pixi = "latest"
ripgrep = "latest"
sccache = "latest"
shellcheck = "latest"
starship = "latest"
tealdeer = "latest"
uv = "latest"
zellij = "latest"
zoxide = "latest"
